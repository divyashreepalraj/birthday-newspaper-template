<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Birthday Poster</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="birthday_container">
            <p class="bd_edition">Birthday Edition</p>
            <h1 class="main_header">BREAKING NEWS</h1>

            <hr class="thick_border" />
            <div class="event_details">
                <p>2025</p>
                <p>Monday, June 5</p>
                <p>7.00 PM</p>
            </div>
            <hr class="thin_border" />
            <hr class="thick_border thick_border1" />

            <div class="content_parent">
                <div class="main_content_container">
                    <img src="./assets/image1.png" alt="img" />
                    <div class="main_content">
                        <p>
                            It is expected to be the most incredible evening of the year. All my friends and family are
                            invited to join me on this great night.
                        </p>
                        <p class="rsvp">RSVP: 000 0000 000</p>
                    </div>
                </div>
                <div class="main_content_container main_content_container1">
                    <div class="main_content">
                        <p class="core_content">IT'S TIME TO CELEBRATE ROHIT'S 6TH BIRTHDAY</p>
                        <button>JOIN US!</button>
                    </div>

                    <img src="./assets/image2.png" alt="img" />
                </div>
            </div>
            <hr class="thin_border last_space" />

        </div>
    </body>
</html>
